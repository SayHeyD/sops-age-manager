name: "Go setup"

description: "Job to setup go and install the dependencies for the project"
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'

    - name: Install ubuntu dev dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install golang gcc gobjc libgl1-mesa-dev xorg-dev -y
      shell: bash

    - name: Install go dependencies
      run: go get -t ./...
      shell: bash